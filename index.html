        * {

            -webkit-tap-highlight-color: transparent;
        }
        
        /* Animações suaves */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
        
        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        
        /* Cards com hover suave */
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.2);
        }
        
        /* Botões com efeito de clique */
        .btn-press:active {
            transform: scale(0.98);
        }
        
        /* Toast notifications */
        .toast {
            animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.7s forwards;
        }
        
        @keyframes toastIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes toastOut {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(100%); opacity: 0; }
        }
        
        /* Modal backdrop */
        .modal-backdrop {
            backdrop-filter: blur(4px);
        }
        
        /* Loading spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Status badges */

        body[data-accent="violet"] .hover\:border-primary-500\/50:hover { border-color: rgba(139,92,246,0.5) !important; }
        body[data-accent="violet"] .has-\[\:checked\]\:border-primary-500:has(:checked) { border-color: #8b5cf6 !important; }
        body[data-accent="violet"] .has-\[\:checked\]\:bg-primary-600\/10:has(:checked) { background-color: rgba(124,58,237,0.1) !important; }
        body[data-accent="violet"] .ring-primary-500 { --tw-ring-color: #8b5cf6 !important; }
        body[data-accent="violet"] .accent-primary-600 { accent-color: #7c3aed !important; }
        
        /* =====================================================
           DASHBOARD MODERNO - Animações e efeitos
           ===================================================== */
        .stat-card {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .stat-card:hover::before {
            opacity: 1;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -12px rgb(0 0 0 / 0.4);
        }
        .stat-icon {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stat-card:hover .stat-icon {
            transform: scale(1.1) rotate(-5deg);
        }
        .stat-value {
            transition: all 0.4s ease;
        }
        .stat-card:hover .stat-value {
            transform: scale(1.05);
        }
        
        /* Barra de progresso animada */
        .progress-bar {
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Gradiente animado para o hero */
        .hero-gradient {
            background: linear-gradient(135deg, rgba(99,102,241,0.15) 0%, rgba(99,102,241,0.05) 40%, transparent 100%);
        }
        
        /* Animação de entrada escalonada */
        .stagger-1 { animation: fadeInUp 0.5s ease-out both; animation-delay: 0.05s; }
        .stagger-2 { animation: fadeInUp 0.5s ease-out both; animation-delay: 0.15s; }
        .stagger-3 { animation: fadeInUp 0.5s ease-out both; animation-delay: 0.25s; }
        .stagger-4 { animation: fadeInUp 0.5s ease-out both; animation-delay: 0.35s; }
        .stagger-5 { animation: fadeInUp 0.5s ease-out both; animation-delay: 0.45s; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Ponto pulsante para status */
        .pulse-dot {
            position: relative;
        }
        .pulse-dot::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        
        /* Card de ação rápida */
        .quick-action {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .quick-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -8px rgb(0 0 0 / 0.4);
        }
        .quick-action:active {
            transform: translateY(-1px) scale(0.98);
        }
        
        /* Linha de gradiente decorativa */
        .gradient-line {
            background: linear-gradient(90deg, transparent, rgba(99,102,241,0.5), transparent);
            height: 1px;
        }
    </style>
</head>
<body class="bg-dark-950 text-white min-h-screen">
    
    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>
    
    <!-- App Container -->
    <div id="app"></div>

    <script>
    // =====================================================
    // SISTEMA DE FORMULÁRIOS - FORMFLOW
    // Arquivo Único - HTML/CSS/JS com TailwindCSS
    // =====================================================

    // =====================================================
    // MÓDULO: Banco de Dados (API central)
    // =====================================================
    const DB = {
        // Cache em memória
        _cache: {
            formularios: [],
            respostas: [],
            config: null
        },
        _loaded: false,

        // URL base da API (mesmo host)
        get apiBase() {
            return window.location.origin;
        },

        // Inicializar: carregar dados da API
        async init() {
            try {
                const [formsRes, respRes, configRes] = await Promise.all([
                    fetch(`${this.apiBase}/api/formularios`),
                    fetch(`${this.apiBase}/api/respostas`),
                    fetch(`${this.apiBase}/api/config`)
                ]);
                this._cache.formularios = await formsRes.json();
                this._cache.respostas = await respRes.json();
                this._cache.config = await configRes.json();
                this._loaded = true;
            } catch (e) {
                console.error('Erro ao carregar dados da API:', e);
                this._cache.formularios = [];
                this._cache.respostas = [];
                this._cache.config = {
                    adminPin: '1234',
                    theme: 'dark',
                    siteName: 'FormFlow',
                    siteDesc: 'Sistema de Formulários',
                    accentColor: 'indigo',
                    notifications: true,
                    compactMode: false,
                    logoType: 'icon',
                    logoPreset: 'file-text',
                    logoCustom: ''
                };
            }
        },

        // Limpar todos os dados
        async clearAll() {
            try {
                await fetch(`${this.apiBase}/api/clear`, { method: 'POST' });
                this._cache.formularios = [];
                this._cache.respostas = [];
                if (this._cache.config) this._cache.config.dataCleared = true;
            } catch (e) {
                console.error('Erro ao limpar dados:', e);
            }
        },

        // Formulários
        getFormularios() {
            return this._cache.formularios || [];
        },

        async saveFormulario(form) {
            try {
                const res = await fetch(`${this.apiBase}/api/formularios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(form)
                });
                const saved = await res.json();
                this._cache.formularios.push(saved);
                return saved;
            } catch (e) {
                console.error('Erro ao salvar formulário:', e);
                return form;
            }
        },

        getFormularioById(id) {
            return this.getFormularios().find(f => f.id === id);
        },

        async deleteFormulario(id) {
            try {
                await fetch(`${this.apiBase}/api/formularios/${id}`, { method: 'DELETE' });
                this._cache.formularios = this._cache.formularios.filter(f => f.id !== id);
                this._cache.respostas = this._cache.respostas.filter(r => r.formularioId !== id);
            } catch (e) {
                console.error('Erro ao excluir formulário:', e);
            }
        },

        // Respostas
        getRespostas() {
            return this._cache.respostas || [];
        },

        async saveResposta(resposta) {
            try {
                const res = await fetch(`${this.apiBase}/api/respostas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(resposta)
                });
                const saved = await res.json();
                this._cache.respostas.push(saved);
                return saved;
            } catch (e) {
                console.error('Erro ao salvar resposta:', e);
                return resposta;
            }
        },

        async updateRespostaStatus(id, status) {
            try {
                await fetch(`${this.apiBase}/api/respostas/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                const idx = this._cache.respostas.findIndex(r => r.id === id);
                if (idx !== -1) {
                    this._cache.respostas[idx].status = status;
                    this._cache.respostas[idx].updatedAt = new Date().toISOString();
                }
            } catch (e) {
                console.error('Erro ao atualizar resposta:', e);
            }
        },

        async deleteResposta(id) {
            try {
                await fetch(`${this.apiBase}/api/respostas/${id}`, { method: 'DELETE' });
                this._cache.respostas = this._cache.respostas.filter(r => r.id !== id);
            } catch (e) {
                console.error('Erro ao excluir resposta:', e);
            }
        },

        getRespostasByFormulario(formId) {
            return this.getRespostas().filter(r => r.formularioId === formId);
        },

        // Config
        getConfig() {
            const defaults = {
                adminPin: '1234',
                theme: 'dark',
                siteName: 'FormFlow',
                siteDesc: 'Sistema de Formulários',
                accentColor: 'indigo',
                notifications: true,
                compactMode: false,
                logoType: 'icon',
                logoPreset: 'file-text',
                logoCustom: ''
            };
            return { ...defaults, ...(this._cache.config || {}) };
        },

        async updateConfig(patch) {
            const config = this.getConfig();
            const updated = { ...config, ...patch };
            this._cache.config = updated;
            try {
                await fetch(`${this.apiBase}/api/config`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updated)
                });
            } catch (e) {
                console.error('Erro ao atualizar config:', e);
            }
            return updated;
        },

        // Gerar dados de exemplo (via API)
        async generateSampleData() {
            try {
                const res = await fetch(`${this.apiBase}/api/sample-data`, { method: 'POST' });
                const result = await res.json();
                if (result.success) {
                    // Recarregar dados do servidor
                    await this.init();
                }
            } catch (e) {
                console.error('Erro ao gerar dados de exemplo:', e);
            }
        }
    };

    // =====================================================
    // MÓDULO: Utilitários
    // =====================================================
    const Utils = {
        formatDate(isoString) {
            const d = new Date(isoString);
            return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        },

        formatDateTime(isoString) {
            const d = new Date(isoString);
            return d.toLocaleDateString('pt-BR', { 
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        },

        timeAgo(isoString) {
            const seconds = Math.floor((new Date() - new Date(isoString)) / 1000);
            if (seconds < 60) return 'Agora mesmo';
            if (seconds < 3600) return `${Math.floor(seconds / 60)} min atrás`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h atrás`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)} dias atrás`;
            return this.formatDate(isoString);
        },

        escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        },

        // Gerar link do formulário (hash-based)
        getFormLink(formId) {
            const base = window.location.origin + window.location.pathname;
            return `${base}#/?form=${formId}`;
        },

        // Copiar para área de transferência
        async copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                return true;
            }
        }
    };

    // =====================================================
    // MÓDULO: Toast Notifications
    // =====================================================
    const Toast = {
        show(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const colors = {
                success: 'bg-emerald-600',
                error: 'bg-red-600',
                info: 'bg-primary-600',
                warning: 'bg-amber-600'
            };
            const icons = {
                success: 'check-circle',
                error: 'x-circle',
                info: 'info',
                warning: 'alert-triangle'
            };
            
            const toast = document.createElement('div');
            toast.className = `toast ${colors[type]} px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 min-w-[280px] max-w-sm`;
            toast.innerHTML = `
                <i data-lucide="${icons[type]}" class="w-5 h-5 flex-shrink-0"></i>
                <span class="text-sm font-medium">${message}</span>
            `;
            container.appendChild(toast);
            lucide.createIcons({ nodes: [toast] });
            
            setTimeout(() => toast.remove(), 3000);
        }
    };

    // =====================================================
    // MÓDULO: Router (SPA) - Hash-Based
    // =====================================================
    const Router = {
        routes: {},
        
        register(path, handler) {
            this.routes[path] = handler;
        },

        navigate(path) {
            window.location.hash = path;
        },

        resolve() {
            const hash = window.location.hash.slice(1) || '/';
            const [pathPart, queryPart] = hash.split('?');
            const path = pathPart || '/';
            
            // Parse query params from hash
            const params = {};
            if (queryPart) {
                queryPart.split('&').forEach(pair => {
                    const [k, v] = pair.split('=');
                    params[decodeURIComponent(k)] = decodeURIComponent(v || '');
                });
            }
            
            // Verificar se é view de formulário público
            if (params.form) {
                this.routes['/form-view']?.(params.form);
                return;
            }
            
            // Rotas públicas (não exigem PIN)
            const publicRoutes = ['/landing'];
            if (publicRoutes.includes(path)) {
                const handler = this.routes[path];
                handler?.(params);
                return;
            }
            
            // Demais rotas exigem autenticação por PIN
            if (!Auth.isAuthenticated()) {
                renderPinLogin();
                return;
            }
            
            // Verificar rotas registradas
            const handler = this.routes[path] || this.routes['/'];
            handler?.(params);
        },

        init() {
            window.addEventListener('hashchange', () => this.resolve());
            if (!window.location.hash) {
                window.location.hash = '/';
            }
            this.resolve();
        }
    };

    // =====================================================
    // MÓDULO: Autenticação (PIN)
    // =====================================================
    const Auth = {
        SESSION_KEY: 'formflow_admin_session',
        PIN_KEY: 'formflow_admin_pin',

        // Verifica se há uma sessão ativa
        isAuthenticated() {
            return sessionStorage.getItem(this.SESSION_KEY) === 'true';
        },

        // Valida o PIN informado
        login(pin) {
            const config = DB.getConfig();
            if (String(pin) === String(config.adminPin)) {
                sessionStorage.setItem(this.SESSION_KEY, 'true');
                return true;
            }
            return false;
        },

        // Encerra a sessão
        logout() {
            sessionStorage.removeItem(this.SESSION_KEY);
        }
    };

    // =====================================================
    // MÓDULO: Logo do Sistema
    // =====================================================
    // Logos pré-configurados (ícone + gradiente)
    const LogoPresets = {
        'file-text':  { icon: 'file-text',  gradient: 'from-primary-500 to-primary-700' },
        'clipboard':  { icon: 'clipboard-list', gradient: 'from-emerald-500 to-teal-700' },
        'form':       { icon: 'form-input', gradient: 'from-amber-500 to-orange-700' },
        'layers':     { icon: 'layers',     gradient: 'from-rose-500 to-pink-700' },
        'shield':     { icon: 'shield-check', gradient: 'from-violet-500 to-purple-700' },
        'send':       { icon: 'send',       gradient: 'from-blue-500 to-indigo-700' },
        'check':      { icon: 'check-circle', gradient: 'from-cyan-500 to-blue-700' },
        'database':   { icon: 'database',   gradient: 'from-fuchsia-500 to-pink-700' }
    };

    // Renderiza o logo conforme a configuração
    function renderLogo(size = 'md') {
        const config = DB.getConfig();
        const sizes = {
            sm: { box: 'w-8 h-8 rounded-lg', icon: 'w-4 h-4' },
            md: { box: 'w-10 h-10 rounded-xl', icon: 'w-5 h-5' },
            lg: { box: 'w-12 h-12 rounded-xl', icon: 'w-6 h-6' }
        };
        const s = sizes[size] || sizes.md;

        // Logo personalizado (imagem enviada pelo admin)
        if (config.logoType === 'custom' && config.logoCustom) {
            return `<img src="${config.logoCustom}" alt="Logo" class="${s.box} object-contain bg-dark-800 border border-dark-700 p-1 flex-shrink-0">`;
        }

        // Logo pré-configurado
        if (config.logoType === 'preset') {
            const preset = LogoPresets[config.logoPreset] || LogoPresets['file-text'];
            return `<div class="${s.box} bg-gradient-to-br ${preset.gradient} flex items-center justify-center flex-shrink-0">
                <i data-lucide="${preset.icon}" class="${s.icon} text-white"></i>
            </div>`;
        }

        // Padrão: ícone com a cor primária
        return `<div class="${s.box} bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center flex-shrink-0">
            <i data-lucide="file-text" class="${s.icon} text-white"></i>
        </div>`;
    }

    // =====================================================
    // COMPONENTES: Sidebar do Admin
    // =====================================================
    const Sidebar = {
        render(activePage) {
            const respostas = DB.getRespostas();
            const pendentes = respostas.filter(r => r.status === 'pendente').length;
            const siteName = DB.getConfig().siteName || 'FormFlow';
            
            return `
                <!-- Mobile Header -->
                <div class="lg:hidden fixed top-0 left-0 right-0 z-40 bg-dark-900/95 backdrop-blur-sm border-b border-dark-700 px-4 py-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <button onclick="toggleSidebar()" class="p-2 hover:bg-dark-700 rounded-xl transition-colors">
                                <i data-lucide="menu" class="w-5 h-5"></i>
                            </button>
                            ${renderLogo('sm')}
                            <span class="text-lg font-bold bg-gradient-to-r from-primary-400 to-primary-600 bg-clip-text text-transparent">${Utils.escapeHtml(siteName)}</span>
                        </div>
                        <div class="relative">
                            <i data-lucide="bell" class="w-5 h-5 text-dark-400"></i>
                            ${pendentes > 0 ? `<span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[10px] flex items-center justify-center font-bold">${pendentes}</span>` : ''}
                        </div>
                    </div>
                </div>
                
                <!-- Sidebar -->
                <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-dark-900 border-r border-dark-700 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
                    <div class="p-6">
                        <div class="flex items-center gap-3 mb-10">
                            ${renderLogo('md')}
                            <span class="text-xl font-bold">${Utils.escapeHtml(siteName)}</span>
                        </div>
                        
                        <nav class="space-y-2">
                            <a href="#" onclick="Router.navigate('/admin'); return false;" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activePage === 'dashboard' ? 'bg-primary-600/20 text-primary-400' : 'hover:bg-dark-800 text-dark-300 hover:text-white'}">
                                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                                <span class="font-medium">Dashboard</span>
                            </a>
                            <a href="#" onclick="Router.navigate('/admin/forms'); return false;" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activePage === 'forms' ? 'bg-primary-600/20 text-primary-400' : 'hover:bg-dark-800 text-dark-300 hover:text-white'}">
                                <i data-lucide="file-plus" class="w-5 h-5"></i>
                                <span class="font-medium">Formulários</span>
                                <span class="ml-auto text-xs bg-dark-700 px-2 py-1 rounded-full">${DB.getFormularios().length}</span>
                            </a>
                            <a href="#" onclick="Router.navigate('/admin/received'); return false;" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activePage === 'received' ? 'bg-primary-600/20 text-primary-400' : 'hover:bg-dark-800 text-dark-300 hover:text-white'}">
                                <i data-lucide="inbox" class="w-5 h-5"></i>
                                <span class="font-medium">Recebidos</span>
                                ${pendentes > 0 ? `<span class="ml-auto text-xs bg-red-500/20 text-red-400 px-2 py-1 rounded-full font-bold">${pendentes} novo${pendentes > 1 ? 's' : ''}</span>` : ''}
                            </a>
                            <a href="#" onclick="Router.navigate('/admin/history'); return false;" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activePage === 'history' ? 'bg-primary-600/20 text-primary-400' : 'hover:bg-dark-800 text-dark-300 hover:text-white'}">
                                <i data-lucide="clock" class="w-5 h-5"></i>
                                <span class="font-medium">Histórico</span>
                            </a>
                            <a href="#" onclick="Router.navigate('/admin/settings'); return false;" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activePage === 'settings' ? 'bg-primary-600/20 text-primary-400' : 'hover:bg-dark-800 text-dark-300 hover:text-white'}">
                                <i data-lucide="settings" class="w-5 h-5"></i>
                                <span class="font-medium">Configurações</span>
                            </a>
                        </nav>
                        
                        <!-- Acesso Rápido -->
                        <div class="mt-6">
                            <div class="flex items-center justify-between mb-3 px-2">
                                <span class="text-[11px] font-semibold text-dark-500 uppercase tracking-wider">Acesso Rápido</span>
                                <button onclick="showCreateFormModal(); closeSidebarMobile();" class="p-1 hover:bg-dark-700 rounded-lg transition-colors" title="Novo formulário">
                                    <i data-lucide="plus" class="w-3.5 h-3.5 text-dark-500"></i>
                                </button>
                            </div>
                            <div class="space-y-1 max-h-[240px] overflow-y-auto pr-1" id="sidebar-quick-forms">
                                ${DB.getFormularios().map(f => {
                                    const respCount = DB.getRespostasByFormulario(f.id).length;
                                    return `
                                    <div class="group rounded-lg hover:bg-dark-800 transition-all">
                                        <button onclick="Router.navigate('/admin/received'); closeSidebarMobile();" class="w-full flex items-center gap-2.5 px-3 py-2 text-left" title="Ver respostas de '${Utils.escapeHtml(f.titulo)}'">
                                            <div class="w-6 h-6 rounded-md bg-dark-800 group-hover:bg-primary-600/20 flex items-center justify-center flex-shrink-0 transition-colors">
                                                <i data-lucide="file-text" class="w-3 h-3 group-hover:text-primary-400 transition-colors"></i>
                                            </div>
                                            <span class="text-sm truncate text-dark-400 group-hover:text-white transition-colors flex-1">${Utils.escapeHtml(f.titulo)}</span>
                                            ${respCount > 0 ? `<span class="text-[10px] bg-primary-600/20 text-primary-400 px-1.5 py-0.5 rounded-full font-medium flex-shrink-0">${respCount}</span>` : ''}
                                        </button>
                                        <div class="flex items-center gap-1 px-3 pb-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button onclick="event.stopPropagation(); copyFormLink('${f.id}')" class="p-1 hover:bg-dark-700 rounded text-dark-500 hover:text-primary-400 transition-colors" title="Copiar link">

    // Toggle sidebar mobile

    // Enviar PIN de login
    function handlePinLogin(e) {
        e.preventDefault();
        const input = document.getElementById('pin-login-input');
        const pin = input.value.trim();
        if (!pin) {
            Toast.show('Digite o PIN de acesso', 'warning');
            return;
        }
        if (Auth.login(pin)) {
            Toast.show('Acesso liberado', 'success');
            Router.resolve();
        } else {
            Toast.show('PIN incorreto', 'error');
            input.value = '';
            input.focus();
        }
    }

    let fieldCounter = 0;

    function addField(data = null) {
        const container = document.getElementById('fields-container');
        const id = fieldCounter++;
        
        const fieldHtml = `
            <div class="bg-dark-800 border border-dark-600 rounded-xl p-4 field-item" data-field-id="${id}">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs text-dark-500 font-medium">Campo ${container.children.length + 1}</span>
                    <button onclick="this.closest('.field-item').remove()" class="p-1 hover:bg-dark-700 rounded-lg transition-colors text-dark-400 hover:text-red-400">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                    <input type="text" placeholder="Rótulo do campo" value="${data?.label || ''}" class="field-label px-3 py-2.5 bg-dark-900 border border-dark-600 rounded-lg text-sm focus:outline-none focus:border-primary-500 transition-colors">
                    <select class="field-type px-3 py-2.5 bg-dark-900 border border-dark-600 rounded-lg text-sm focus:outline-none focus:border-primary-500 transition-colors" onchange="toggleOptions(this)">
                        <option value="texto" ${data?.tipo === 'texto' ? 'selected' : ''}>Texto</option>
                        <option value="email" ${data?.tipo === 'email' ? 'selected' : ''}>E-mail</option>
                        <option value="tel" ${data?.tipo === 'tel' ? 'selected' : ''}>Telefone</option>
                        <option value="number" ${data?.tipo === 'number' ? 'selected' : ''}>Número</option>
                        <option value="date" ${data?.tipo === 'date' ? 'selected' : ''}>Data</option>
                        <option value="textarea" ${data?.tipo === 'textarea' ? 'selected' : ''}>Texto Longo</option>
                        <option value="select" ${data?.tipo === 'select' ? 'selected' : ''}>Lista Suspensa</option>
                        <option value="radio" ${data?.tipo === 'radio' ? 'selected' : ''}>Seleção Única</option>
                        <option value="checkbox" ${data?.tipo === 'checkbox' ? 'selected' : ''}>Múltipla Escolha</option>
                    </select>
                </div>
                <div class="field-options-container ${['select', 'radio', 'checkbox'].includes(data?.tipo) ? '' : 'hidden'}">
                    <label class="block text-xs text-dark-500 mb-1">Opções (uma por linha)</label>
                    <textarea class="field-options w-full px-3 py-2 bg-dark-900 border border-dark-600 rounded-lg text-sm focus:outline-none focus:border-primary-500 transition-colors resize-none" rows="3" placeholder="Opção 1&#10;Opção 2&#10;Opção 3">${data?.opcoes?.join('\n') || ''}</textarea>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="req-${id}" class="field-required w-4 h-4 rounded bg-dark-900 border-dark-600 text-primary-600 focus:ring-primary-500" ${data?.obrigatorio ? 'checked' : ''}>
                    <label for="req-${id}" class="text-xs text-dark-400">Obrigatório</label>
                </div>
            </div>
        `;
        
        container.insertAdjacentHTML('beforeend', fieldHtml);
        lucide.createIcons({ nodes: [container.lastElementChild] });
    }

    function toggleOptions(select) {
        const container = select.closest('.field-item').querySelector('.field-options-container');
        if (['select', 'radio', 'checkbox'].includes(select.value)) {
            container.classList.remove('hidden');
        } else {
            container.classList.add('hidden');
        }
    }

    async function saveForm() {
        const title = document.getElementById('form-title').value.trim();
        const desc = document.getElementById('form-desc').value.trim();
        const fieldItems = document.querySelectorAll('.field-item');
        
        if (!title) {
            Toast.show('Informe o título do formulário', 'error');
            return;
        }
        
        if (fieldItems.length === 0) {
            Toast.show('Adicione pelo menos um campo', 'error');
            return;
        }
        
        const campos = [];
        let valid = true;
        
        fieldItems.forEach((item, index) => {
            const label = item.querySelector('.field-label').value.trim();
            const tipo = item.querySelector('.field-type').value;
            const obrigatorio = item.querySelector('.field-required').checked;
            
            if (!label) {
                Toast.show(`Campo ${index + 1}: informe o rótulo`, 'error');
                valid = false;
                return;
            }
            
            const campo = { id: 'c' + Date.now() + index, tipo, label, obrigatorio };
            
            if (['select', 'radio', 'checkbox'].includes(tipo)) {
                const optionsText = item.querySelector('.field-options').value.trim();
                campo.opcoes = optionsText.split('\n').filter(o => o.trim());
                if (campo.opcoes.length === 0) {
                    Toast.show(`Campo "${label}": adicione pelo menos uma opção`, 'error');
                    valid = false;
                    return;
                }
            }
            
            campos.push(campo);
        });
        
        if (!valid || campos.length === 0) return;
        
        await DB.saveFormulario({ titulo: title, descricao: desc, campos });
        closeModal('create-form-modal');
        Toast.show('Formulário criado com sucesso!');
        renderForms();
    }

    function copyFormLink(formId) {
        const link = Utils.getFormLink(formId);
        Utils.copyToClipboard(link);
        Toast.show('Link copiado para a área de transferência!');

    async function deleteForm(formId) {
        if (confirm('Tem certeza que deseja excluir este formulário?')) {
            await DB.deleteFormulario(formId);
            Toast.show('Formulário excluído', 'info');

    function renderRespostaCard(r) {

            arquivado: 'bg-dark-700/50 border-dark-600'

        return `
            <div class="resposta-card card-hover bg-dark-900 border ${statusColors[r.status]} rounded-2xl p-4 md:p-5 cursor-pointer transition-all" data-status="${r.status}" onclick="viewResposta('${r.id}')">

                    <div class="w-11 h-11 rounded-xl bg-dark-800 flex items-center justify-center flex-shrink-0">
                        <i data-lucide="user" class="w-5 h-5 text-dark-400"></i>

                        </div>
                        <p class="text-sm text-dark-400 mb-2">${Utils.timeAgo(r.receivedAt)}</p>
                        <div class="flex flex-wrap gap-2">
                            ${Object.entries(r.dados).slice(0, 3).map(([k, v]) => `
                                <span class="text-xs bg-dark-800 px-2 py-1 rounded-lg text-dark-300">${Utils.escapeHtml(k)}: ${Utils.escapeHtml(String(v).substring(0, 30))}</span>
                            `).join('')}
                            ${Object.keys(r.dados).length > 3 ? `<span class="text-xs text-dark-500">+${Object.keys(r.dados).length - 3} campos</span>` : ''}
                        </div>
                    </div>
                    <div class="flex-shrink-0">
                        <button onclick="event.stopPropagation(); cycleStatus('${r.id}')" class="p-2 hover:bg-dark-800 rounded-lg transition-colors" title="Alterar status">
                            <i data-lucide="refresh-cw" class="w-4 h-4 text-dark-400"></i>

                    </div>
                </div>
            </div>
        `;

    function filterReceived(status) {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.className = 'filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-dark-800 text-dark-400 border border-dark-700';
        });
        document.querySelector(`[data-filter="${status}"]`).className = 'filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-primary-600/20 text-primary-400 border border-primary-500/30';
        
        document.querySelectorAll('.resposta-card').forEach(card => {
            if (status === 'todos' || card.dataset.status === status) {
                card.style.display = '';
            } else {

    async function changeStatus(id, status) {
        await DB.updateRespostaStatus(id, status);
        Toast.show(`Status alterado para "${status}"`, 'info');
        closeModal('view-resposta-modal');
        
        // Re-render conforme a página atual (hash-based)
        const hash = window.location.hash.slice(1).split('?')[0];
        if (hash === '/admin/received') renderReceived();
        else if (hash === '/admin/history') renderHistory();
        else renderDashboard();
    }

    async function cycleStatus(id) {
        const r = DB.getRespostas().find(resp => resp.id === id);
        if (!r) return;
        const order = ['pendente', 'lido', 'arquivado'];
        const next = order[(order.indexOf(r.status) + 1) % order.length];
        await DB.updateRespostaStatus(id, next);
        Toast.show(`Status alterado para "${next}"`, 'info');
        renderReceived();
    }

    async function deleteResposta(id) {
        if (confirm('Excluir esta resposta permanentemente?')) {
            await DB.deleteResposta(id);
            closeModal('view-resposta-modal');
            Toast.show('Resposta excluída', 'info');
            const hash = window.location.hash.slice(1).split('?')[0];
            if (hash === '/admin/received') renderReceived();
            else if (hash === '/admin/history') renderHistory();
            else renderDashboard();
        }
    }

    function filterHistory() {
        const search = document.getElementById('history-search').value.toLowerCase();
        const formId = document.getElementById('history-form-filter').value;
        const status = document.getElementById('history-status-filter').value;
        
        document.querySelectorAll('.resposta-card').forEach(card => {
            const text = card.textContent.toLowerCase();
            const matchesSearch = !search || text.includes(search);
            
            // Para formulário e status, precisamos acessar os dados
            const cardId = card.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
            const resposta = DB.getRespostas().find(r => r.id === cardId);
            
            const matchesForm = formId === 'todos' || resposta?.formularioId === formId;
            const matchesStatus = status === 'todos' || resposta?.status === status;
            
            card.style.display = (matchesSearch && matchesForm && matchesStatus) ? '' : 'none';
        });
    }

    // =====================================================
    // EXPORTAÇÃO: PDF e DOC
    // =====================================================
    function exportPDF(id) {
        const r = DB.getRespostas().find(resp => resp.id === id);
        if (!r) return;
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // Header
        doc.setFillColor(30, 41, 59);
        doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(20);
        doc.text('FormFlow', 20, 20);
        doc.setFontSize(10);
        doc.text(`Formulário: ${r.formularioTitulo}`, 20, 28);
        doc.text(`Recebido: ${Utils.formatDateTime(r.receivedAt)}`, 20, 34);
        
        // Status
        const statusColors = { pendente: [245, 158, 11], lido: [16, 185, 129], arquivado: [107, 114, 128] };
        const [sr, sg, sb] = statusColors[r.status] || [107, 114, 128];
        doc.setFillColor(sr, sg, sb);
        doc.roundedRect(160, 12, 30, 10, 3, 3, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(8);
        doc.text(r.status.toUpperCase(), 175, 19, { align: 'center' });
        
        // Content
        let y = 55;
        doc.setTextColor(30, 41, 59);
        
        Object.entries(r.dados).forEach(([key, value]) => {
            doc.setFontSize(9);
            doc.setTextColor(100, 116, 139);
            doc.text(key.toUpperCase(), 20, y);
            
            y += 7;
            doc.setFontSize(12);
            doc.setTextColor(30, 41, 59);
            
            const lines = doc.splitTextToSize(String(value || '—'), 170);
            doc.text(lines, 20, y);
            y += lines.length * 6 + 12;
            
            if (y > 270) {
                doc.addPage();
                y = 20;
            }
        });
        
        // Footer
        doc.setFontSize(8);
        doc.setTextColor(150, 150, 150);
        doc.text(`Gerado por FormFlow em ${Utils.formatDateTime(new Date().toISOString())}`, 105, 290, { align: 'center' });
        
        doc.save(`FormFlow_${r.formularioTitulo.replace(/\s+/g, '_')}_${Utils.formatDate(r.receivedAt).replace(/\//g, '-')}.pdf`);
        Toast.show('PDF exportado com sucesso!');
    }

    function renderFormField(campo) {
        const required = campo.obrigatorio ? 'required' : '';
        const requiredMark = campo.obrigatorio ? '<span class="text-red-400 ml-1">*</span>' : '';
        
        let input = '';
        
        switch (campo.tipo) {
            case 'textarea':
                input = `<textarea name="${campo.id}" ${required} rows="3" placeholder="Digite sua resposta..." class="w-full px-4 py-3.5 bg-dark-800 border border-dark-600 rounded-xl text-base focus:outline-none focus:border-primary-500 transition-colors resize-none" style="min-height: 100px;"></textarea>`;
                break;
            case 'select':
                input = `
                    <select name="${campo.id}" ${required} class="w-full px-4 py-3.5 bg-dark-800 border border-dark-600 rounded-xl text-base focus:outline-none focus:border-primary-500 transition-colors appearance-none" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2394a3b8%22 stroke-width=%222%22><path d=%22m6 9 6 6 6-6%22/></svg>'); background-repeat: no-repeat; background-position: right 12px center;">
                        <option value="" disabled selected>Selecione...</option>
                        ${(campo.opcoes || []).map(o => `<option value="${Utils.escapeHtml(o)}">${Utils.escapeHtml(o)}</option>`).join('')}
                    </select>
                `;
                break;
            case 'radio':
                input = `
                    <div class="space-y-2">
                        ${(campo.opcoes || []).map((o, i) => `
                            <label class="flex items-center gap-3 px-4 py-3.5 bg-dark-800 border border-dark-600 rounded-xl cursor-pointer hover:border-primary-500/50 transition-colors has-[:checked]:border-primary-500 has-[:checked]:bg-primary-600/10">
                                <input type="radio" name="${campo.id}" value="${Utils.escapeHtml(o)}" ${required} class="w-4 h-4 text-primary-600 bg-dark-900 border-dark-600 focus:ring-primary-500">
                                <span class="text-base">${Utils.escapeHtml(o)}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                break;
            case 'checkbox':
                input = `
                    <div class="space-y-2">
                        ${(campo.opcoes || []).map((o, i) => `
                            <label class="flex items-center gap-3 px-4 py-3.5 bg-dark-800 border border-dark-600 rounded-xl cursor-pointer hover:border-primary-500/50 transition-colors has-[:checked]:border-primary-500 has-[:checked]:bg-primary-600/10">
                                <input type="checkbox" name="${campo.id}" value="${Utils.escapeHtml(o)}" class="w-4 h-4 text-primary-600 bg-dark-900 border-dark-600 rounded focus:ring-primary-500">
                                <span class="text-base">${Utils.escapeHtml(o)}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                break;
            default:
                input = `<input type="${campo.tipo}" name="${campo.id}" ${required} placeholder="Digite aqui..." class="w-full px-4 py-3.5 bg-dark-800 border border-dark-600 rounded-xl text-base focus:outline-none focus:border-primary-500 transition-colors">`;
        }
        
        return `
            <div class="fade-in">

    async function submitForm(e, formId) {
        e.preventDefault();
        
        const form = DB.getFormularioById(formId);
        if (!form) return;
        
        const formData = new FormData(e.target);
        const dados = {};
        let valid = true;
        
        form.campos.forEach(campo => {
            if (campo.tipo === 'checkbox') {
                const values = formData.getAll(campo.id);
                dados[campo.label] = values.join(', ');
            } else {
                dados[campo.label] = formData.get(campo.id) || '';
            }
            
            if (campo.obrigatorio && !dados[campo.label]) {
                valid = false;
            }
        });
        
        if (!valid) {
            Toast.show('Preencha todos os campos obrigatórios', 'error');
            return;
        }
        
        // Desabilitar botão
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Enviando...';
        
        // Enviar para a API
        await DB.saveResposta({
            formularioId: formId,
            formularioTitulo: form.titulo,
            dados
        });
        
        document.getElementById('public-form').classList.add('hidden');
        document.getElementById('success-message').classList.remove('hidden');
        
        Toast.show('Formulário enviado com sucesso!');
    }

    function applyTheme() {
        const config = DB.getConfig();
        const body = document.body;
        if (config.theme === 'light') {
            body.classList.add('theme-light');
        } else {
            body.classList.remove('theme-light');
        }
        // Aplicar cor primária
        body.setAttribute('data-accent', config.accentColor || 'indigo');
        const accentMap = {
            indigo: '#6366f1',
            blue: '#3b82f6',
            emerald: '#10b981',
            amber: '#f59e0b',
            rose: '#f43f5e',
            violet: '#8b5cf6'
        };
        const accent = accentMap[config.accentColor] || '#6366f1';
        document.documentElement.style.setProperty('--accent', accent);
    }

    // Enviar imagem personalizada como logo
    function handleLogoUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        // Validar tipo de arquivo
        if (!file.type.startsWith('image/')) {
            Toast.show('Envie um arquivo de imagem válido', 'error');
            return;
        }
        
        // Limitar tamanho (2MB)
        if (file.size > 2 * 1024 * 1024) {
            Toast.show('A imagem deve ter no máximo 2MB', 'error');
            return;
        }
        
        const reader = new FileReader();
        reader.onload = async function(e) {
            const dataUrl = e.target.result;
            await DB.updateConfig({ logoType: 'custom', logoCustom: dataUrl });
            renderSettings();
            Toast.show('Logo personalizado aplicado', 'success');
        };
        reader.onerror = function() {
            Toast.show('Erro ao ler a imagem', 'error');
        };
        reader.readAsDataURL(file);
    }

    // Remover logo personalizado
    async function clearCustomLogo() {
        await DB.updateConfig({ logoType: 'icon', logoCustom: '' });
        renderSettings();
        Toast.show('Logo personalizado removido', 'info');
    }

    // Alterar PIN
    async function changePin() {
        const config = DB.getConfig();
        const current = document.getElementById('settings-pin-current').value;
        const newPin = document.getElementById('settings-pin-new').value;
        if (current !== config.adminPin) {
            Toast.show('PIN atual incorreto', 'error');
            return;
        }
        if (!newPin || newPin.length < 4) {
            Toast.show('Novo PIN deve ter pelo menos 4 dígitos', 'error');
            return;
        }
        await DB.updateConfig({ adminPin: newPin });
        document.getElementById('settings-pin-current').value = '';
        document.getElementById('settings-pin-new').value = '';
        Toast.show('PIN alterado com sucesso', 'success');
    }

    // Exportar dados
    function exportData() {
        const data = {
            formularios: DB.getFormularios(),
            respostas: DB.getRespostas(),
            config: DB.getConfig(),
            exportedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `formflow-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        Toast.show('Dados exportados com sucesso', 'success');
    }

    // Importar dados
    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                if (data.formularios) {
                    localStorage.setItem(DB.KEYS.FORMULARIOS, JSON.stringify(data.formularios));
                }
                if (data.respostas) {
                    localStorage.setItem(DB.KEYS.RESPOSTAS, JSON.stringify(data.respostas));
                }
                if (data.config) {
                    localStorage.setItem(DB.KEYS.CONFIG, JSON.stringify(data.config));
                }
                Toast.show('Dados importados com sucesso', 'success');
                renderSettings();
            } catch (err) {
                Toast.show('Arquivo inválido', 'error');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // Limpar todos os dados
    async function clearAllData() {
        if (confirm('Tem certeza que deseja apagar TODOS os dados? Esta ação não pode ser desfeita.')) {
            await DB.clearAll();
            Toast.show('Todos os dados foram apagados', 'info');
            renderSettings();
        }
    }

    // =====================================================
    // INICIALIZAÇÃO DO SISTEMA
    // =====================================================
    async function init() {
        // Carregar dados da API
        await DB.init();
        await DB.generateSampleData();
        applyTheme();
        
        // Registrar rotas
        Router.register('/', renderDashboard);
        Router.register('/landing', renderLanding);
        Router.register('/admin', renderDashboard);
        Router.register('/admin/forms', renderForms);
        Router.register('/admin/received', renderReceived);
        Router.register('/admin/history', renderHistory);
        Router.register('/admin/settings', renderSettings);
        Router.register('/form-view', renderFormView);
        
        // Iniciar router
        Router.init();
    }

    // Iniciar quando DOM estiver pronto
    document.addEventListener('DOMContentLoaded', init);
    </script>
